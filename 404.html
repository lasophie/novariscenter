<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable | Novaris Language Center</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0e2a5c">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
    .nf .nf__code { font: 800 clamp(4rem, 14vw, 8rem) var(--font-head); color: var(--gold); line-height: 1; margin: 0; }
    .nf img { margin: 0 auto 24px; mix-blend-mode: multiply; filter: brightness(1.1) contrast(1.18); }
    .nf p { color: var(--muted); max-width: 46ch; margin-inline: auto; }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <img src="/assets/img/emblem.webp" alt="" width="104" height="96">
      <p class="nf__code">404</p>
      <h1>Cette page n'existe pas</h1>
      <p>Le lien est peut-être incorrect ou la page a été déplacée. Retrouvez nos cours d'anglais à Dakar depuis la page d'accueil.</p>
      <p><a class="btn btn--primary" href="/">Retour à l'accueil</a></p>
    </div>
  </main>
</body>
</html>
